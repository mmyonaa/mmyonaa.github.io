<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="임현아(Hyona Lim) · 풀스택 개발자 포트폴리오. Vue · Next.js · TypeScript · Koa · Fastify · PostgreSQL 기반의 웹 서비스와 AI · 보안 프로젝트를 설계·개발합니다."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Hyona Lim · Full-stack Developer</title>

    <!-- SEO / Open Graph (링크 공유 미리보기) -->
    <!-- 배포 주소가 확정되면 아래 og:url·og:image·canonical 의 도메인을 실제 주소로 교체하세요 -->
    <link rel="canonical" href="https://mmyonaa.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hyona Lim · Portfolio" />
    <meta property="og:title" content="Hyona Lim — Full-stack Developer" />
    <meta
      property="og:description"
      content="풀스택 개발자 임현아(Hyona Lim)의 포트폴리오 — Vue · Next.js · AI · 보안 기반 웹 서비스 설계·개발."
    />
    <meta property="og:url" content="https://mmyonaa.github.io/" />
    <meta property="og:image" content="https://mmyonaa.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hyona Lim — Full-stack Developer" />
    <meta
      name="twitter:description"
      content="풀스택 개발자 임현아(Hyona Lim)의 포트폴리오 — Vue · Next.js · AI · 보안 기반 웹 서비스 설계·개발."
    />
    <meta name="twitter:image" content="https://mmyonaa.github.io/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 첫 페인트 전에 테마 적용해 깜빡임 방지 (?theme= > 저장값 > 기본 dark)
      try {
        var q = new URLSearchParams(location.search).get('theme')
        document.documentElement.dataset.theme = q || localStorage.getItem('theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
