    <link rel="preload" href="/fonts/Manrope-300-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SpaceMono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 첫 페인트 전에 테마 적용해 깜빡임 방지 (?theme= > 저장값 > 기본 dark)
      try {
        var q = new URLSearchParams(location.search).get('theme')
        document.documentElement.dataset.theme = q || localStorage.getItem('theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
